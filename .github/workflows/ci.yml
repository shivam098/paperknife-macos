name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # The Release workflow runs this one with the version it publishes.
  workflow_call:
    inputs:
      version:
        description: The version to package, such as 0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh

      - name: Check PDFium
        run: |
          otool -D third_party/pdfium/mac/lib/libpdfium.dylib
          lipo -info third_party/pdfium/mac/lib/libpdfium.dylib
          cat third_party/pdfium/mac/VERSION

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  package:
    name: Package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build, check and pack the app
        env:
          VERSION: ${{ inputs.version || '0.0.0-dev' }}
        run: scripts/package-app.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: paperknife-mac-release
          path: artifacts/release/
          if-no-files-found: error

  # The package job checks the app on Apple silicon with the newest macOS; these run the files a
  # user downloads on an older macOS and on Intel.
  check:
    name: Check the app on ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paperknife-mac-release
          path: release

      - name: Check the checksums
        working-directory: release
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Run the app from the disk image
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/PaperKnife release/PaperKnife-*-mac.dmg
          ls -l /tmp/PaperKnife
          codesign --verify --strict --verbose=2 /tmp/PaperKnife/PaperKnife.app
          /tmp/PaperKnife/PaperKnife.app/Contents/MacOS/PaperKnife --self-check
          hdiutil detach /tmp/PaperKnife

      - name: Run the app from the ZIP
        run: |
          ditto -x -k release/PaperKnife-*-mac.zip unzipped
          codesign --verify --strict --verbose=2 unzipped/PaperKnife.app
          unzipped/PaperKnife.app/Contents/MacOS/PaperKnife --self-check

  # A picture of the window with a PDF opened the way Finder opens one, to review the interface.
  screenshot:
    name: Screenshot
    needs: package
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: paperknife-mac-release
          path: release

      - name: Open a PDF, take a screenshot, and click its text
        run: |
          brew install cliclick
          ditto -x -k release/PaperKnife-*-mac.zip app
          open -a "$PWD/app/PaperKnife.app" "$PWD/conformance/documents/90f66aab2200.pdf"
          sleep 10
          screencapture -x screenshot.png
          bash scripts/ci-click-page.sh 0.2191 0.1365 "Hello World" screenshot-selected.png
          osascript -e 'quit app "PaperKnife"' || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paperknife-mac-screenshot
          path: screenshot*.png
          if-no-files-found: error
