name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh

      - name: Check PDFium
        run: |
          otool -D third_party/pdfium/mac/lib/libpdfium.dylib
          lipo -info third_party/pdfium/mac/lib/libpdfium.dylib
          cat third_party/pdfium/mac/VERSION

      - name: Build
        run: swift build

      - name: Test
        run: swift test
